# ============================================================================
# Alert rules — SYMPTOM-based multi-window multi-burn-rate SLO alerting
# (docs/10 §7, Google SRE practice). Fast-burn => page; slow-burn => ticket.
# These feed the §4 auto-rollback guardrails (Argo Rollouts AnalysisTemplates
# query the same error-budget burn). Every alert links to a runbook (docs/10 §7:
# "a service without a runbook is not production-ready").
#
# Burn-rate math for a 99.95% SLO (error budget = 0.0005):
#   fast page : 14.4x budget burn over 1h AND 5m windows  (~2% budget in 1h)
#   slow tick : 6x   budget burn over 6h AND 30m windows
# ============================================================================
groups:
  - name: nexus.slo.burn
    rules:
      - alert: SLOFastBurn
        expr: |
          service:http_errors:ratio_rate1h > (14.4 * 0.0005)
          and
          service:http_errors:ratio_rate5m > (14.4 * 0.0005)
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Fast error-budget burn on {{ $labels.service }}"
          description: "{{ $labels.service }} in {{ $labels.namespace }} is burning its 99.95% error budget at >14.4x (1h & 5m windows). Page on-call; canary guardrail should auto-abort."
          runbook_url: "https://runbooks.nexus.internal/slo/fast-burn"

      - alert: SLOSlowBurn
        expr: |
          service:http_errors:ratio_rate6h > (6 * 0.0005)
          and
          service:http_errors:ratio_rate30m > (6 * 0.0005)
        for: 15m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Slow error-budget burn on {{ $labels.service }}"
          description: "{{ $labels.service }} burning error budget at >6x (6h & 30m). File a reliability ticket; watch for escalation to fast-burn."
          runbook_url: "https://runbooks.nexus.internal/slo/slow-burn"

  - name: nexus.slo.latency
    rules:
      - alert: SearchLatencySLOBreach
        # NFR-PERF-01: search read path p95 <= 400ms.
        expr: service:http_request_latency:p95_5m{route="/"} > 0.4
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "p95 latency SLO breach on {{ $labels.service }}"
          description: "{{ $labels.service }} route {{ $labels.route }} p95 > 400ms for 10m (NFR-PERF-01)."
          runbook_url: "https://runbooks.nexus.internal/slo/latency"

  - name: nexus.targets
    rules:
      - alert: ServiceScrapeDown
        expr: up{job="nexus-pods"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.pod }}"
          description: "Target {{ $labels.namespace }}/{{ $labels.pod }} down 5m — metrics/OTel presence gate (docs/10 §2) implies every service must be scrapable."
          runbook_url: "https://runbooks.nexus.internal/obs/scrape-down"
