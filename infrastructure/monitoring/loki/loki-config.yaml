# ============================================================================
# Loki — log aggregation (docs/09 §11: structured JSON logs correlated by trace
# ID). Receives OTLP logs from the OTel Collector. Separate failure domain
# (ADR-0017 R-060). This is a SKELETON single-target config; prod runs the
# simple-scalable/microservices mode backed by S3 object storage.
# ============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:              # prod: swap for `s3:` (object-store archive, docs/09 §11)
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1      # prod: >=3 across AZs
  ring:
    kvstore:
      store: inmemory

# OTLP-native ingestion so the collector's otlphttp/loki exporter lands here.
limits_config:
  allow_structured_metadata: true
  retention_period: 720h     # 30d hot (docs/09 §11: 30-90d hot + object-store archive)
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://alertmanager.observability.svc.cluster.local:9093
