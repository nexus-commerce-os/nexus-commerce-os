# pnpm workspace — the JS/TS side of the monorepo (Go/Python services build via their own toolchains).
# Rationale: pnpm's content-addressable store gives reproducible, fast installs; workspaces let
# packages/* be consumed by apps/* and services/* without publishing.
# nosemgrep -- The pnpm supply-chain settings Semgrep's OWASP-A06 pack recommends
# (minimumReleaseAge / trustPolicy / blockExoticSubdeps) are pnpm >=10 features; this repo
# pins pnpm 9.7.0 via the root packageManager field, so they are not yet applicable.
# Tracked to be adopted (and this suppression removed) as part of the pnpm-10 upgrade.
packages:
  - "apps/*"
  - "services/*"          # TS services (auth, etc.); Go/Python services ignore this
  - "packages/*"
