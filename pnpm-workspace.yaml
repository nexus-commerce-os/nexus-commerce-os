# pnpm workspace — the JS/TS side of the monorepo (Go/Python services build via their own toolchains).
# Rationale: pnpm's content-addressable store gives reproducible, fast installs; workspaces let
# packages/* be consumed by apps/* and services/* without publishing.
# The pnpm supply-chain settings Semgrep's OWASP-A06 pack recommends (minimumReleaseAge /
# trustPolicy / blockExoticSubdeps) are pnpm >=10 features; this repo pins pnpm 9.7.0 via the
# root packageManager field, so they are not yet applicable. Adopt them (and remove the
# suppression below) as part of the pnpm-10 upgrade.
# nosemgrep
packages:
  - "apps/*"
  - "services/*"          # TS services (auth, etc.); Go/Python services ignore this
  - "packages/*"
