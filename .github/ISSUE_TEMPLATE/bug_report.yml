name: Bug report
description: Report a defect in NEXUS Commerce OS (not a security vulnerability)
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security vulnerabilities here** — use
        [Security → Report a vulnerability](https://github.com/nexus-commerce-os/nexus-commerce-os/security/advisories/new)
        (see [SECURITY.md](../../SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component / path
      placeholder: "e.g. services/platform-hello, infrastructure/terraform/modules/network"
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Commit SHA, OS, Node/pnpm/Go/Terraform versions, environment (dev/staging/prod).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant logs. **Redact secrets.**
      render: shell
    validations:
      required: false
