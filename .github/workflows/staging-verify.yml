# Deploy an ISOLATED staging Worker and measure what Cloudflare actually does.
#
# WHY THIS EXISTS
# Everything about the security headers has been verified at the level of "the
# rule is present in the artifact that ships". Nobody has ever measured a
# response from a Cloudflare Worker serving this site with `_headers` in place,
# because the only deployment is production and production must not be used as
# a test bed. Cloudflare's own documentation says `_headers` rules "are not
# applied to responses generated by your Worker code", which is exactly the kind
# of statement that should be confirmed against a real response rather than
# trusted because it was read carefully.
#
# WHY IT IS A WORKFLOW AND NOT SOMETHING RUN LOCALLY
# It was going to be run from the maintainer's machine. That machine has no disk
# left -- wrangler cannot be installed on it at all. A runner has disk, a clean
# environment and a log anyone can re-read, which makes it the better home for
# this regardless.
#
# HOW IT STAYS AWAY FROM PRODUCTION
#   * a different Worker name, so it cannot overwrite `honesttotal`
#   * NO `routes` block, so it can never attach to honesttotal.com or www
#   * `workers_dev = true`, so it is reachable only on *.workers.dev
#   * its own KV namespace, so it cannot read or write the real waitlist
#   * the staging config is generated here and never committed, so it cannot be
#     deployed by accident from a checkout
# The production `wrangler.toml` is not read, not copied and not modified.
#
# BEFORE THE FIRST RUN the owner must add one repository secret:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" for this account, which
#                            also covers creating the staging KV namespace.
#   CLOUDFLARE_ACCOUNT_ID  — the account the Worker lives in.

name: staging-verify

on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Type KEEP to leave the staging Worker running afterwards (default: delete it)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: staging-verify
  cancel-in-progress: false

env:
  STAGING_NAME: honesttotal-staging
  KV_TITLE: honesttotal-staging-WAITLIST

jobs:
  verify:
    name: Deploy staging, measure, tear down
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse to run from a branch that cannot deploy
        # WHY THIS EXISTS. These two workflows live on `main` only so GitHub
        # will list them: a `workflow_dispatch` workflow is not dispatchable
        # unless it exists on the DEFAULT branch, and until this file landed
        # here the Actions API answered "workflow deploy-web.yml not found on
        # the default branch" and neither could be started at all.
        #
        # But `main` cannot deploy. It has no `apps/web/wrangler.toml`, no
        # Worker and no Cloudflare anywhere; the branch that ships is
        # `release/product-catalog`, and the Run workflow dialog's ref picker
        # is what selects it. Without this check, dispatching from the default
        # ref would install dependencies, lint, typecheck and only then fail
        # inside wrangler with something unhelpful.
        run: |
          if [ ! -f apps/web/wrangler.toml ]; then
            echo "::error::No apps/web/wrangler.toml on ref '${GITHUB_REF_NAME}'. This workflow must be run against release/product-catalog — pick that branch in the Run workflow dialog."
            exit 1
          fi
          echo "wrangler.toml present on ${GITHUB_REF_NAME} — this ref can deploy."

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the real site
        # Not a stub. The point is to measure the artifact that would ship,
        # including `out/_headers`, so this runs the same build production does
        # -- release gate, verify-headers, verify-footer and all.
        run: pnpm --filter @nexus/web build

      - name: Staging KV namespace (create once, reuse after)
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd apps/web
          list=$(npx --yes wrangler@4 kv namespace list)
          id=$(echo "$list" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const t=process.env.KV_TITLE;
              const m=(JSON.parse(s)||[]).find(n=>n.title===t||n.title.endsWith('-'+t));
              process.stdout.write(m?m.id:'');
            });")
          if [ -z "$id" ]; then
            echo "creating KV namespace ${KV_TITLE}"
            out=$(npx --yes wrangler@4 kv namespace create "${KV_TITLE}")
            echo "$out"
            id=$(echo "$out" | grep -oE '"?id"?[ =:]+"?[0-9a-f]{32}' | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$id" ]; then
            echo "::error::could not determine a staging KV namespace id"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "staging KV namespace resolved"

      - name: Generate the staging config (never committed)
        run: |
          set -euo pipefail
          cat > apps/web/wrangler.staging.toml <<EOF
          name = "${STAGING_NAME}"
          main = "worker/index.ts"
          compatibility_date = "2026-01-01"
          workers_dev = true

          [assets]
          directory = "./out"
          binding = "ASSETS"
          not_found_handling = "404-page"

          [[kv_namespaces]]
          binding = "WAITLIST"
          id = "${{ steps.kv.outputs.id }}"
          EOF
          echo "--- staging config (no routes, no custom domain) ---"
          cat apps/web/wrangler.staging.toml
          if grep -q "routes" apps/web/wrangler.staging.toml; then
            echo "::error::staging config contains a routes block — refusing to deploy"
            exit 1
          fi

      - name: Deploy staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd apps/web
          out=$(npx --yes wrangler@4 deploy --config wrangler.staging.toml)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            echo "::error::could not find the workers.dev URL in the deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "STAGING URL: $url"
          echo "### Staging URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure the response headers Cloudflare actually sends
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # Workers take a moment to propagate to the edge after a first deploy.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/" || true)
            [ "$code" = "200" ] && break
            echo "waiting for the staging Worker ($code) ..."; sleep 10
          done

          fail=0
          check() { # check <path> <header> <expected-substring>
            v=$(curl -s -D - -o /dev/null --max-time 20 "$URL$1" | tr -d '\r' | grep -i "^$2:" | head -1 | cut -d' ' -f2-)
            if echo "$v" | grep -qi -- "$3"; then
              printf '  OK   %-14s %-28s %s\n' "$1" "$2" "${v:0:60}"
            else
              printf '  FAIL %-14s %-28s got: %s\n' "$1" "$2" "${v:-<absent>}"; fail=1
            fi
          }

          echo "=== static page, served by the asset layer ==="
          check / strict-transport-security   "max-age=31536000"
          check / content-security-policy     "frame-ancestors 'none'"
          check / x-content-type-options      "nosniff"
          check / x-frame-options             "DENY"
          check / referrer-policy             "strict-origin-when-cross-origin"
          check / permissions-policy          "camera=()"

          echo "=== Worker-generated response: _headers does NOT reach these ==="
          check /api/waitlist x-content-type-options  "nosniff"
          check /api/waitlist x-frame-options         "DENY"
          check /api/waitlist content-security-policy "default-src 'none'"
          check /api/waitlist cache-control           "no-store"

          echo "=== cookies: the privacy notice says there are none ==="
          for p in / /privacy /api/waitlist; do
            sc=$(curl -s -D - -o /dev/null --max-time 20 "$URL$p" | tr -d '\r' | grep -ci '^set-cookie:' || true)
            if [ "$sc" = "0" ]; then echo "  OK   $p sets no cookie"; else echo "  FAIL $p sent $sc Set-Cookie"; fail=1; fi
          done

          [ "$fail" = "0" ] || { echo "::error::header verification failed"; exit 1; }

      - name: Exercise the waitlist API against isolated storage
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          fail=0
          want() { # want <label> <expected-code> <actual-code>
            if [ "$2" = "$3" ]; then echo "  OK   $1 -> $3"; else echo "  FAIL $1 -> $3, wanted $2"; fail=1; fi
          }
          post() { curl -s -o /tmp/body -w '%{http_code}' --max-time 20 -X POST "$URL/api/waitlist" \
                     -H 'content-type: application/json' --data "$1"; }

          want "GET (wrong method)" 405 "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/api/waitlist")"
          want "POST malformed body" 400 "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$URL/api/waitlist" -H 'content-type: application/json' --data 'not json')"
          want "POST invalid address" 422 "$(post '{"email":"not-an-email"}')"

          # Test addresses only, on a reserved TLD that can never receive mail,
          # written to the staging namespace and nowhere near the real list.
          addr="staging-$(date +%s)@example.invalid"
          want "POST new address" 200 "$(post "{\"email\":\"$addr\"}")"
          grep -q '"status":"added"' /tmp/body || { echo "  FAIL first submit did not report added: $(cat /tmp/body)"; fail=1; }
          want "POST same address again" 200 "$(post "{\"email\":\"$addr\"}")"
          grep -q '"status":"duplicate"' /tmp/body || { echo "  FAIL second submit did not report duplicate: $(cat /tmp/body)"; fail=1; }

          echo "=== per-IP throttle: 5 per minute, so the 6th should be refused ==="
          last=""
          for i in 1 2 3 4 5 6 7; do last=$(post '{"email":"not-an-email"}'); done
          want "7th rapid POST" 429 "$last"
          grep -qi 'too many' /tmp/body || { echo "  FAIL 429 body was not the Worker's message: $(cat /tmp/body)"; fail=1; }
          curl -s -D - -o /dev/null --max-time 20 -X POST "$URL/api/waitlist" -H 'content-type: application/json' \
            --data '{"email":"not-an-email"}' | tr -d '\r' | grep -i '^retry-after:' || { echo "  FAIL no retry-after on 429"; fail=1; }

          [ "$fail" = "0" ] || { echo "::error::waitlist API verification failed"; exit 1; }

      - name: Confirm production was untouched
        # The staging Worker must not have attached itself to anything real.
        run: |
          set -euo pipefail
          for p in / /privacy /terms /faq; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://honesttotal.com$p")
            echo "  honesttotal.com$p -> $code"
            [ "$code" = "200" ] || { echo "::error::production $p returned $code"; exit 1; }
          done
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://honesttotal.com/api/waitlist)
          echo "  honesttotal.com/api/waitlist (GET) -> $api"
          [ "$api" = "405" ] || { echo "::error::production waitlist returned $api"; exit 1; }

      - name: Tear down
        if: always() && inputs.keep != 'KEEP'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd apps/web
          # The KV namespace is deliberately kept: deleting and recreating it on
          # every run churns ids for no benefit, and it holds nothing but
          # example.invalid test addresses.
          npx --yes wrangler@4 delete --config wrangler.staging.toml --force || \
            echo "::warning::staging Worker could not be deleted — remove ${STAGING_NAME} by hand"
          echo "staging Worker removed"
