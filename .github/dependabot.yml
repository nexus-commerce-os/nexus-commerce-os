version: 2
updates:
  # GitHub Actions — keep pinned action SHAs current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    # why: OWASP A06 supply-chain — hold a freshly published version for a cooldown so a
    # compromised or yanked release is caught before it can land in an update PR.
    cooldown:
      default-days: 7

  # Node / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
    groups:
      dev-dependencies:
        dependency-type: "development"
    cooldown:
      default-days: 7

  # Go services
  - package-ecosystem: "gomod"
    directory: "/services/platform-hello"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "go"]
    cooldown:
      default-days: 7

  # Terraform providers/modules
  - package-ecosystem: "terraform"
    directory: "/infrastructure/terraform"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "terraform"]
    cooldown:
      default-days: 7

  # Python tooling (scripts, services/ai)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "python"]
    cooldown:
      default-days: 7
