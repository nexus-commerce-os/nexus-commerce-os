version: 2
updates:
  # GitHub Actions — keep pinned action SHAs current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  # Node / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
    groups:
      # why: a group with no update-types collapses patch, minor AND major into one PR
      # (PR #59: 13 updates, 8 of them majors, unreviewable as a unit). Restricting the
      # routine group to minor+patch leaves every major to arrive as its own PR, which is
      # the only way a breaking bump can be judged on its own evidence.
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Go services
  - package-ecosystem: "gomod"
    directory: "/services/platform-hello"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "go"]

  # Terraform providers/modules
  - package-ecosystem: "terraform"
    directory: "/infrastructure/terraform"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "terraform"]

  # Python tooling (scripts, services/ai)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "python"]
