<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="NEXUS">
  <!--
    The nav brand mark, redrawn as an icon: a dark rounded square with an
    inset diamond whose lower-right edges pick up the accent green. Previously
    there was no icon at all, so every tab showed the browser's default and the
    production build logged a 404 for /favicon.ico.
  -->
  <rect width="32" height="32" rx="8" fill="#111a16" />
  <g transform="rotate(45 16 16)">
    <rect x="10" y="10" width="12" height="12" rx="2" fill="none" stroke="#f5f7f4" stroke-width="2.5" />
    <path d="M22 10.8v10.4a1 1 0 0 1-1 1H10.8" fill="none" stroke="#0e9f6e" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
