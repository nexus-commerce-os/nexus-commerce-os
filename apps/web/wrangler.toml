# Cloudflare Worker for honesttotal.com — the public brand surface.
#
# The Worker serves `out/` (produced by `next build` with output: 'export') and
# answers POST /api/waitlist itself. See worker/index.ts for why the API route
# moved out of Next.
#
# Routes are attached after the domain is active in this account; until then
# `wrangler deploy` publishes to the workers.dev subdomain, which is enough to
# verify the build without touching DNS.

name = "honesttotal"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

# Custom domains rather than routes: Cloudflare creates and owns the DNS
# records and the certificate, so there is no hand-maintained A/CNAME to drift
# out of sync with where the Worker actually is.
routes = [
  { pattern = "honesttotal.com", custom_domain = true },
  { pattern = "www.honesttotal.com", custom_domain = true },
]

# Request logs, so we can tell "the verifier never reached us" apart from
# "the verifier reached us and disliked the response" — two failures that look
# identical from the outside.
[observability]
enabled = true

# The release gate, attached to wrangler itself rather than only to an npm
# script. `deploy:cf` runs the gate first, but that is a convention: anyone in
# this directory can type `npx wrangler deploy` and skip it entirely. Cloudflare
# documents that a `[build] command` "will be run as part of `wrangler dev` and
# `npx wrangler deploy`", so putting the gate here puts it on the CLI path too.
#
# HONEST LIMITS OF THIS, because it would be easy to overstate:
#   * Cloudflare does NOT document what happens when the build command exits
#     non-zero. It is very likely to abort the deploy, and that is the whole
#     point of putting it here, but it is not a documented guarantee and has not
#     been proven against a real deploy. Treat it as defence in depth, not as
#     the enforcement boundary.
#   * It cannot stop an upload from the Cloudflare dashboard, or anything else
#     that does not go through wrangler.
#   * The ONLY real enforcement is custody of the Cloudflare API token plus
#     branch protection on the branch that ships. Neither is a file in this
#     repository.
#
# The script decides for itself whether to block, from WRANGLER_COMMAND: it
# enforces on `deploy` and `versions upload` and merely reports on `dev`, so
# previewing the site locally is never blocked by an unfilled legal fact.
[build]
command = "node scripts/build-catalog.mjs && node scripts/release-gate.mjs && node scripts/verify-deploy-provenance.mjs"

[assets]
directory = "./out"
binding = "ASSETS"
# Unknown paths serve Next's exported 404 page rather than a bare Worker error.
not_found_handling = "404-page"

# Run the Worker BEFORE the asset service for documents, so it can stamp a
# per-response CSP nonce on the HTML (worker/index.ts, serveAsset).
#
# Without this the Worker is never invoked for a path that matches an asset —
# Cloudflare answers from the asset service directly — which is why the API
# route worked (no asset matches /api/waitlist) while the HTML never reached
# our code at all. Measured after the first nonce deploy: the CSP came back
# with no nonce and `CF-Cache-Status: HIT`, proving the Worker had not run.
#
# `/_next/*` is excluded deliberately. Those are the hashed, immutable JS and
# CSS bundles: they need no nonce, they are the bytes that benefit most from
# edge caching, and sending every one of them through a Worker would spend CPU
# to change nothing.
run_worker_first = ["/*", "!/_next/*"]

[[kv_namespaces]]
binding = "WAITLIST"
id = "12a90ce4e895472399c8cd741e5623ad"

# The published catalogue. PRODUCTION database, which is empty: no merchant has
# been authorised, so the publication pointer has never moved and the catalogue
# pages render an honest empty state.
#
# The fixture data lives in honesttotal-catalog-STAGING and cannot reach here:
# that is a different database, and the production one carries
# `environment = 'production'`, which makes the scheduler refuse fixture
# sources by transport, by id and by merchant id.
[[d1_databases]]
binding = "CATALOG"
database_name = "honesttotal-catalog-prod"
database_id = "26b88f39-a560-4e31-97be-db48faee97cb"
